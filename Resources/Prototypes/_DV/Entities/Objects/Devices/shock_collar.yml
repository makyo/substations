- type: entity
  parent: Clothing
  id: ClothingNeckShockCollar
  name: shock collar
  suffix: SelfUnremovable
  description: An electric collar that shocks on the signal.
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: Clothing/Neck/Misc/shock_collar.rsi
    state: icon
  - type: Clothing
    sprite: Clothing/Neck/Misc/shock_collar.rsi
    stripDelay: 10
    equipDelay: 5 # to avoid accidentally falling into the trap associated with SelfUnremovableClothing
    quickEquip: true
    slots:
    - neck
  - type: SelfUnremovableClothing
  - type: ShockOnUnequip
    damage: 10
    duration: 3
  - type: AccessReader
    access:
    - - Security
  - type: ShockOnTrigger
    damage: 5
    duration: 3
    targetContainer: true
  # Begin L5 modifications - trigger refactor
  - type: UseDelayOnTrigger
  - type: UseDelay
    delay: 4
  - type: UseDelayTriggerCondition
  # End L5
  - type: TriggerOnSignal
  - type: DeviceLinkSink
    ports:
      - Trigger
  - type: GuideHelp
    guides:
      - Security
  - type: Tag
    tags:
    - WhitelistChameleon
