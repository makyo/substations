# Actions
- type: entity
  parent: BaseMentalAction # L5 - action ECS; should maybe be BaseAction tho
  id: ActionStationAiOpenShop
  name: Choose programs
  description: Configure your installed programs
  components:
  - type: Action # L5 - action ECS
    itemIconStyle: BigAction
    icon:
      sprite: _DV/Interface/Actions/actions_ai.rsi
      state: store
  - type: InstantAction # L5 - action ECS
    event: !type:StationAiShopActionEvent

- type: entity
  parent: BaseAction # L5 - action ECS
  id: ActionStationAiRgbLighting
  name: RGB Lighting # L5 - fix for TestNoManualEntityLocStrings
  description: Adjust a light's color controller to add or remove an RGB effect # L5 - fix for TestNoManualEntityLocStrings
  components:
  - type: EntityTargetAction
    whitelist:
      tags:
      - LightFixture
    # Begin L5 changes - action ECS
    event: !type:StationAiRgbLightingActionEvent
  - type: TargetAction
    range: -1
    checkCanAccess: false
  - type: Action
    itemIconStyle: BigAction
    icon:
      sprite: _DV/Interface/Actions/actions_ai.rsi
      state: rgb_lighting
    checkCanInteract: false
    useDelay: 30
  # End L5 changes

- type: entity
  parent: BaseAction # L5 - action ECS
  id: ActionStationAiLightSynthesizer
  name: Light Synthesizer # L5 - fix for TestNoManualEntityLocStrings
  description: Send some nanites to synthesize a replacement light bulb in a fixture # L5 - fix for TestNoManualEntityLocStrings
  components:
  - type: EntityTargetAction
    whitelist:
      tags:
      - LightFixture
    # Begin L5 changes - action ECS
    event: !type:StationAiLightSynthesizerActionEvent
      bulbPrototype: LightTube
      tubePrototype: LightTube
  - type: TargetAction
    checkCanAccess: false
    range: -1
  - type: Action
    itemIconStyle: BigAction
    icon:
      sprite: _DV/Interface/Actions/actions_ai.rsi
      state: light_synthesizer
    checkCanInteract: false
    useDelay: 300
  # End L5 changes

- type: entity
  parent: BaseAction # L5 - action ECS
  id: ActionStationAiBikeHorn
  name: HONK.mp3 # L5 - fix for TestNoManualEntityLocStrings
  description: Play an amusing audio clip from a holopad # L5 - fix for TestNoManualEntityLocStrings
  components:
  - type: EntityTargetAction
    whitelist:
      components:
      - Holopad
    # Begin L5 changes - action ECS
    event: !type:StationAiPlaySoundActionEvent
      sound:
        collection: BikeHorn
        params:
          variation: 0.125
  - type: TargetAction
    checkCanAccess: false
    range: -1
  - type: Action
    itemIconStyle: BigAction
    icon:
      sprite: _DV/Interface/Actions/actions_ai.rsi
      state: bike_horn
    checkCanInteract: false
    useDelay: 60
  # End L5 changes

- type: entity
  parent: BaseAction
  id: ActionStationAiHoloPointer
  name: Holopointer # L5 - fix for TestNoManualEntityLocStrings
  description: Circle an area of interest with a hologram # L5 - fix for TestNoManualEntityLocStrings
  components:
  - type: WorldTargetAction
    # Begin L5 changes - action ECS
    event: !type:StationAiSpawnEntityActionEvent
      entity: StationAiHolopointer
  - type: TargetAction
    range: -1
    checkCanAccess: false
  - type: Action
    itemIconStyle: BigAction
    icon:
      sprite: _DV/Interface/Actions/actions_ai.rsi
      state: holopointer
    checkCanInteract: false
    useDelay: 15
  # End L5 changes

- type: entity
  id: StationAiHolopointer
  name: holopointer
  description: A hologram projected by the station's AI to bring your attention to something.
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Sprite
    sprite: _DV/Objects/Misc/holopointer.rsi
    state: target_circle
  - type: TimedDespawn
    lifetime: 15
  - type: PointLight
    enabled: true
    radius: 1
    color: red
  - type: Clickable

- type: entity
  parent: BaseAction # L5 - action ECS
  id: ActionStationAiRepairNanites
  name: Repair Nanites # L5 - fix for TestNoManualEntityLocStrings
  description: Send some nanites to give a cyborg some minor repairs # L5 - fix for TestNoManualEntityLocStrings
  components:
  - type: EntityTargetAction
    whitelist:
      components:
      - BorgChassis
    # Begin L5 changes - action ECS
    event: !type:StationAiHealthChangeActionEvent
      damage:
        groups:
          Burn: -20
          Brute: -20
  - type: TargetAction
    checkCanAccess: false
    range: -1
  - type: Action
    itemIconStyle: BigAction
    icon:
      sprite: _DV/Interface/Actions/actions_ai.rsi
      state: nanites
    checkCanInteract: false
    useDelay: 120
  # End L5 changes

- type: entity
  parent: BaseAction # L5 - action ECS
  id: ActionStationAiEmergencySealant
  name: Emergency Sealant # L5 - fix for TestNoManualEntityLocStrings
  description: Deploy some metal foam to seal breaches # L5 - fix for TestNoManualEntityLocStrings
  components:
  - type: WorldTargetAction
    # Begin L5 changes - action ECS
    event: !type:StationAiSmokeActionEvent
      duration: 10
      spreadAmount: 8
      smokePrototype: AluminiumMetalFoam
  - type: TargetAction
    range: -1
    checkCanAccess: false
  - type: Action
    itemIconStyle: BigAction
    icon:
      sprite: _DV/Interface/Actions/actions_ai.rsi
      state: emergency_sealant
    checkCanInteract: false
    useDelay: 300
  # End L5 changes
