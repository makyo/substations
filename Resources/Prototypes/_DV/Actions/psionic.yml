- type: entity
  parent: BaseAction # L5 - action ECS
  id: ActionDispel
  name: Dispel
  description: Dispel summoned entities such as familiars or forcewalls.
  components:
  - type: EntityTargetAction
  # Begin L5 changes - action ECS
    event: !type:DispelPowerActionEvent
    canTargetSelf: false
  - type: TargetAction
    checkCanAccess: false
    range: 6
  - type: Action
    icon:
      sprite: _DV/Interface/Actions/actions_psionics.rsi
      state: dispel
    useDelay: 45
    checkCanInteract: false
    itemIconStyle: BigAction
  # End L5 changes

- type: entity
