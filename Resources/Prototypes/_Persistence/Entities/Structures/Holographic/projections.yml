# L5 — added inheritance, use DV sprites

- type: entity
  id: HCDConstructBase
  name: HCD constructible
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: PointLight
    radius: 1.5
    energy: 1.2
    softness: 0.8
    color: "#00f2ff"
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Clickable

- type: entity
  id: HCDWall
  parent: HCDConstructBase
  name: holographic wall
  description: A flickering projection of a wall.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _DV/Structures/Walls/solid.rsi
    drawdepth: Overlays
    layers:
    - state: full
      color: "#00f2ff99" # Adjusts the color to a ghostly blue

