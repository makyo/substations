- type: entity
  id: HCD
  parent: [ BaseItem, BaseEngineeringContraband ]
  name: HCD
  description: The hardlight construction device can be used to depoy long lasting holograms, used to assist in construction.
  components:
  - type: RCD
    availablePrototypes:
    - HCDWall
    - HCDWallReinforced
    - HCDGrille
    - HCDWindow
    - HCDWindowReinforced
    - HCDWindowDirectional
    - HCDAirlock
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot {}
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
  - type: Sprite
    sprite: _Persistence/Objects/Tools/hcd.rsi
    state: icon
  - type: Item
    size: Normal
  - type: Clothing
    sprite: _Persistence/Objects/Tools/hcd.rsi
    quickEquip: false
    slots:
    - Belt
  - type: PhysicalComposition
    materialComposition:
      Steel: 300
      Plastic: 100
  - type: StaticPrice
    price: 110
  - type: UserInterface
    interfaces:
      enum.RcdUiKey.Key:
        type: RCDMenuBoundUserInterface
  - type: ActivatableUI
    inHandsOnly: true
    key: enum.RcdUiKey.Key
