- type: entity
  id: BaseStructureDestructible
  abstract: true
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  id: BaseStructureIndestructible
  abstract: true
  components:
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 0

- type: entity
  id: BaseStructureWallmount
  abstract: true
  placement:
    mode: SnapgridCenter
    snap:
    - Wallmount
  components:
  - type: Sprite
    drawdepth: WallMountedItems
    snapCardinals: false
  - type: WallMount
    arc: 175
  - type: Transform
    noRot: false
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Fixtures
    fixtures: {}

- type: entity
  id: BaseStructureLockImmuneToEmag
  abstract: true
  components:
  - type: Lock
    breakOnAccessBreaker: false

- type: entity
  id: BaseStructureAccessReaderImmuneToEmag
  abstract: true
  components:
  - type: AccessReader
    breakOnAccessBreaker: false
