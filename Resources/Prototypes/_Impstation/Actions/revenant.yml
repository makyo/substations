- type: entity
  parent: BaseAction # L5 - action ECS
  id: ActionRevenantHaunt
  name: Haunt
  description: Gives essence and stolen essence for every witness.
  components:
  - type: Action # L5 - action ECS
    itemIconStyle: NoItem
    icon:
      sprite: Mobs/Ghosts/revenant.rsi
      state: icon
  # Begin L5 changes - action ECS
    useDelay: 20
  - type: InstantAction
    event: !type:RevenantHauntActionEvent
  # End L5 changes

- type: entity
  parent: BaseAction # L5 - action ECS
  id: ActionRevenantBloodWriting
  name: Blood Writing
  description: Costs 2 Essence per glyph.
  components:
  - type: Action # L5 - action ECS
    itemIconStyle: NoItem
    icon: Interface/Actions/blood-writing.png
  # Begin L5 changes - action ECS
    useDelay: 1
  - type: InstantAction
    event: !type:RevenantBloodWritingEvent
  # End L5 changes

- type: entity
  parent: BaseAction # L5 - action ECS
  id: ActionRevenantAnimate
  name: Animate
  description: Costs 50 Essence.
  components:
  # Begin L5 changes - action ECS
  - type: Action
    itemIconStyle: NoItem
    icon: Interface/Actions/animate.png
    useDelay: 1
  - type: TargetAction
  - type: EntityTargetAction
    whitelist:
      components:
      - Item
    canTargetSelf: false
    event: !type:RevenantAnimateEvent
  # End L5 changes
