- type: reagent
  id: ButterfliesReagent
  name: reagent-name-butterflies
  group: Toxins #getting scared is basically toxins
  desc: reagent-desc-butterflies
  physicalDesc: reagent-physical-desc-nervous
  flavor: sweet
  color: "#f8eb73"
  tileReactions:
    - !type:CreateEntityTileReaction
      entity: MobButterfly
      usage: 3
      maxOnTile: 3
      randomOffsetMax: 0.3
      maxOnTileWhitelist:
        tags: [ Butterfly ]
  metabolisms:
    Poison:
      effects:
        - !type:PopupMessage
          type: Local
          messages:
            - "butterflies-effect-stomach"
            - "butterflies-effect-looks"
            - "butterflies-effect-heart"
            - "butterflies-effect-exciting"
            - "butterflies-effect-hands"
            - "butterflies-effect-chaos"
            - "butterflies-effect-chaos-two"
            - "butterflies-effect-chaos-three"
          probability: 0.1

- type: reagent
  id: ButterfliesBiggerReagent
  name: reagent-name-butterfliesbigger
  group: Toxins #getting scared is basically toxins
  desc: reagent-desc-butterfliesbigger
  physicalDesc: reagent-physical-desc-reallynervous
  flavor: sweet
  color: "#c0992e"
  tileReactions:
    - !type:CreateEntityTileReaction
      entity: MobButterfly # L5 - we don't have biggerflies
      usage: 1 # L5
      maxOnTile: 1 # L5
      randomOffsetMax: 0.3
      maxOnTileWhitelist:
        tags: [ Butterfly ]
    - !type:CreateEntityTileReaction
      entity: MobButterfly # L5 - we don't have biggerflies so we run it again
      usage: 1 # L5
      maxOnTile: 1 # L5
      randomOffsetMax: 0.3
      maxOnTileWhitelist:
        tags: [ Butterfly ]
    - !type:CreateEntityTileReaction
      entity: MobButterfly # L5 - we don't have biggerflies so we run it three times because fuck it. Also why can't I specify a count here? :P
      usage: 1 # L5
      maxOnTile: 1 # L5
      randomOffsetMax: 0.3
      maxOnTileWhitelist:
        tags: [ Butterfly ]
  metabolisms:
    Poison:
      effects:
        - !type:PopupMessage
          type: Local
          messages:
            - "butterflies-effect-stomach"
            - "butterflies-effect-looks"
            - "butterflies-effect-heart"
            - "butterflies-effect-exciting"
            - "butterflies-effect-hands"
            - "butterflies-effect-chaos"
            - "butterflies-effect-chaos-two"
            - "butterflies-effect-chaos-three"
          probability: 0.4
