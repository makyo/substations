- type: trait
  category: Diet
  id: PescetarianDiet
  name: trait-dietary-restriction-PescetarianRestriction-name
  description: trait-dietary-restriction-PescetarianRestriction-desc
  effects:
  - !type:AddCompsEffect
    components:
    - type: PescetarianRestriction
  conditions:
  - !type:HasCompCondition
    component: Silicon
    invert: true
  - !type:HasCompCondition
    component: BorgChassis
    invert: true
    tooltip: trait-condition-borg-not
  - !type:IsSpeciesCondition
    species: IPC
    invert: true

