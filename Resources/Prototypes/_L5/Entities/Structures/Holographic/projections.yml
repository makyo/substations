- type: entity
  id: StaticField
  parent: HoloFan
  name: static field
  description: A powered barrier of hard light that blocks air, but nothing else.
  components:
  - type: Sprite
    sprite: _L5/Structures/Holo/staticfield.rsi
    layers:
      - state: powered
        map: ["enum.StaticFieldVisualLayers.Powered"]
      - state: unpowered
        map: ["enum.StaticFieldVisualLayers.Unpowered"]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
  - type: Transform # DeltaV
    noRot: true
  - type: ApcPowerReceiver
  - type: StaticField
