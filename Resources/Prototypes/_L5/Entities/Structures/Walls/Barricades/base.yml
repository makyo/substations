# This is essentially a slimmed down version of RMC's original: https://github.com/RMC-14/RMC-14/blob/master/Resources/Prototypes/_RMC14/Entities/Structures/Walls/Barricades/barricade_base.yml

- type: entity
  abstract: true
  id: L5BarricadeBase
  placement:
    mode: SnapgridCenter
  components:
  - type: Rotatable
  - type: Appearance
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,-0.38"
        density: 500
        mask:
        - FullTileMask
        layer:
        - TableLayer
  - type: RotationDrawDepth
    southDrawDepth: OverMobs
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: CMBarricade
  - type: InteractionOutline
  - type: Flammable
    fireSpread: false
    maximumFireStacks: 0.5
    damage:
      types:
        Heat: 2
