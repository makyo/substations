      amount: 3
      prob: 0.5
    - id: FoodLemon
      amount: 3
      prob: 0.5
    - id: FoodLime
      amount: 3
      prob: 0.5
    - id: FoodApple
      amount: 3
      prob: 0.5
    - id: FoodBerries
      amount: 3
      prob: 0.5
      # Uncommon (10%)
