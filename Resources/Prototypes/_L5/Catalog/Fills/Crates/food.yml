- type: entity
  id: CrateFoodProduce
  parent: CrateFreezer
  name: produce crate
  description: A freezer-chest for storing foods that need to stay cold.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: FillCrateFoodProduce

- type: entityTable
  id: FillCrateFoodProduce
  table: !type:AllSelector
    children:
      # Normal (50%)
    - id: FoodCarrot
      amount: 3
      prob: 0.5
    - id: FoodTomato
      amount: 2
      prob: 0.5
    - id: FoodPotato
      amount: 2
      prob: 0.5
    - id: FoodEggplant
      amount: 3
      prob: 0.5
    - id: FoodCorn
      amount: 2
      prob: 0.5
