- type: constructionGraph
#  parent: RMC # L5
  id: BarricadeHandrailGraph
  start: start
  graph:
  - node: start
    actions:
    - !type:DeleteEntity
    edges:
    - to: nodeHandrail
      completed:
      - !type:SnapToGrid
      steps:
      - material: Steel # L5 — was CMSteel
        amount: 2
        doAfter: 3

  - node: nodeHandrail
    entity: RMCBarricadeHandrail
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: SheetSteel1 # L5 — was CMSheetMetal1
        amount: 2
      - !type:DeleteEntity
      conditions:
      - !type:EntityAnchored
        anchored: false
      steps:
      - tool: Screwing
        doAfter: 3
