# Handrails
- type: entity
  parent: L5BarricadeBase # L5 — was CMBarricadeBase
  id: RMCBarricadeHandrail
  name: handrail
  description: A railing, for your hands. Woooow.
  components:
  - type: Sprite
    drawdepth: WallTops
    sprite: _RMC14/Structures/Walls/Barricades/barricade.rsi
    state: handrail_a_0
  - type: Physics
  - type: Repairable
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Climbable
  - type: Construction
    graph: BarricadeHandrailGraph
    node: nodeHandrail

- type: entity
  parent: RMCBarricadeHandrail
  id: RMCBarricadeHandrailAlt
  components:
  - type: Sprite
    state: handrail_b_0
  - type: Construction
    graph: BarricadeHandrailGraph
    node: nodeHandrail

