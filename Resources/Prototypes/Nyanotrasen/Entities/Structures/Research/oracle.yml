# L5 - Oracle disconnected from its functionality to fit the setting. Now it's just a pretty statue.
- type: entity
  parent: BaseStructure
  id: Oracle
  name: The Oracle of the Post-Anthropocene
  description: A statue of some unknown entity with a plaque beneath that reads "For every time, an oracle; for every era, a voice." They hold a bowl, a common receptacle for offerings of all kinds.
  components:
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    offset: "0.0,0.5"
    sprite: _DV/Structures/Decoration/statues.rsi
    layers:
      - state: oracle-0
      - map: ["enum.SolutionContainerLayers.Fill"]
        state: oracle-0
  - type: Oracle
  - type: Speech
    speechSounds: Tenor
  - type: Psionic
  - type: SolutionContainerManager
    solutions:
      fountain:
        maxVol: 200
  - type: Edible
    edible: Drink
    solution: fountain
  - type: DrawableSolution
    solution: fountain
  - type: DrainableSolution
    solution: fountain
  - type: ExaminableSolution
    solution: fountain
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 10
    fillBaseName: oracle-
  - type: Grammar
    attributes:
      gender: female
      proper: true
  - type: Prayable
  - type: SpriteFade
  - type: Tag
    tags: []
